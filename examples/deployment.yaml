apiVersion: apps/v1
kind: Deployment
metadata:
  name: workers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workers
  template:
    metadata:
      labels:
        app: workers
    spec:
      containers:
        - name: worker
          image: alpine:3.24
          command: ["/bin/sh", "-c"]
          args: ["while true; do sleep 3600; done"]
