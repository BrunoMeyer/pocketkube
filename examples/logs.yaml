apiVersion: v1
kind: Pod
metadata:
  name: logs-demo
spec:
  containers:
    - name: logger
      image: alpine:3.21
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            echo "$(date -u) stdout message"
            echo "$(date -u) stderr message" >&2
            sleep 2
          done
